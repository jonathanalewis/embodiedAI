<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Galbot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0' stop-color='%23b7b5ff'/%3E%3Cstop offset='1' stop-color='%235e5ce6'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Title slide: the only setup is picking two languages -->
  <main id="start" class="start">
    <div class="start-orb" aria-hidden="true"></div>
    <h1 class="wordmark">Galbot</h1>
    <p class="tagline">Two people. Two languages. One conversation.</p>

    <div class="pickers">
      <label class="picker">
        <span class="picker-label">Left</span>
        <select id="lang-A" aria-label="Language of the person on the left"></select>
      </label>
      <button id="swap" class="swap" type="button" aria-label="Swap languages" title="Swap">⇄</button>
      <label class="picker">
        <span class="picker-label">Right</span>
        <select id="lang-B" aria-label="Language of the person on the right"></select>
      </label>
    </div>

    <button id="begin" class="begin" type="button">Begin</button>
    <p id="start-note" class="start-note" role="status"></p>
  </main>

  <!-- Conversation: one side per person, Galbot in the middle -->
  <main id="talk" class="talk" hidden>
    <section id="side-A" class="side" data-side="A">
      <header class="side-head">
        <button class="side-lang" type="button" title="Tap when this person is about to speak"></button>
      </header>
      <div class="lines" aria-live="polite"></div>
      <form class="type-box" autocomplete="off">
        <input type="text" enterkeyhint="send" aria-label="Type instead of speaking">
        <button type="submit" aria-label="Send">↑</button>
      </form>
    </section>

    <section class="center">
      <button id="orb" class="orb" type="button" data-state="idle" aria-label="Galbot">
        <span class="orb-glow"></span>
        <span class="orb-core"></span>
        <span class="orb-ring"></span>
      </button>
      <div id="orb-label" class="orb-label"></div>
      <div id="chips" class="chips" aria-label="Active instructions"></div>
      <!-- Reserved for a sign-language avatar / camera in a later version -->
      <div id="sign-panel" class="sign-panel" hidden></div>
      <div id="notices" class="notices" role="status"></div>
      <button id="end" class="end" type="button">End</button>
    </section>

    <section id="side-B" class="side" data-side="B">
      <header class="side-head">
        <button class="side-lang" type="button" title="Tap when this person is about to speak"></button>
      </header>
      <div class="lines" aria-live="polite"></div>
      <form class="type-box" autocomplete="off">
        <input type="text" enterkeyhint="send" aria-label="Type instead of speaking">
        <button type="submit" aria-label="Send">↑</button>
      </form>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
